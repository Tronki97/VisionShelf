<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Nomi Marker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-blue-400 text-center md:text-left">Gestione nomi</h1>
            <div class="flex flex-wrap justify-center gap-3">
                <a href="/" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition text-sm md:text-base text-center">
                    Area scansione
                </a>
                <a href="/markers" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition text-sm md:text-base text-center">
                    Elenco Item
                </a>
                <a href="/log" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition text-sm md:text-base text-center">
                    Log Item
                </a>
            </div>
        </div>        

        <div class="w-1/4 mb-2">
            <button onclick="salvaTutto()" 
                    class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-bold transition">Salva tutto</button>
        </div>
        <div class="bg-gray-800 rounded-lg shadow p-6 mb-8 border border-gray-700">
            <h2 class="text-xl font-bold mb-4 text-purple-400">Impostazioni di Sistema</h2>

            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div class="w-full md:w-1/4 text-lg text-gray-300">Indirizzo IP ESP32:</div>
                <div class="w-full md:w-2/4">
                    <input type="text" id="ip-esp32" value="{{ esp_ip }}" 
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-purple-500" 
                           placeholder="es. http://192.168.43.50">
                </div>
                <div class="w-full md:w-1/4 text-right md:text-right">
                    <button onclick="salvaIP()" 
                            class="w-full md:w-auto bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded font-bold transition text-white shadow-md">Salva IP</button>
                </div>
            </div>
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 mt-6">
                <div class="w-full md:w-1/4 text-lg text-gray-300">imposta intervallo Scansione (minuti):</div>
                <div class="w-full md:w-2/4">
                    <input type="number" id="intervallo-scansione" value="{{ intervallo }}" min="1"
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-purple-500" 
                           placeholder="Es. 5">
                </div>
                <div class="w-full md:w-1/4 md:text-right">
                    <button onclick="salvaIntervallo()" 
                    class="w-full md:w-auto bg-purple-600 hover:bg-purple-500 px-4 py-2 rounded font-bold transition text-white shadow-md">Salva Timer</button>
                </div>  
            </div>
        </div>
    </div>
        <div class="bg-gray-800 rounded-lg shadow p-6">
            {% for marker in markers %}
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between border-b border-gray-700 py-4 gap-3">
                <div class="w-full md:w-1/4 text-lg text-blue-400 font-bold">ID: {{ marker.id }}</div>
                <div class="w-full md:w-2/4">
                    <input type="text" id="nome-{{ marker.id }}" value="{{ marker.nome }}" 
                           class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500" 
                           placeholder="Assegna un nome...">
                </div>
                <div class="w-full md:w-1/4 md:text-right">
                    <button onclick="salvaNome({{ marker.id }})" 
                            class="w-full md:w-auto bg-green-600 hover:bg-green-500 px-4 py-2 rounded font-bold transition">Salva</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function salvaNome(id, silenzioso = false) {
            const nuovoNome = document.getElementById(`nome-${id}`).value;
            fetch('/salva_nome', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: id, nome: nuovoNome })
            })
            .then(r => r.json())
            .then(data => {
                if (!silenzioso){
                    alert("Nome salvato con successo per l'ID " + id + "!");
                }
            });
        }
        
        function salvaTutto() {
            const tuttiGliInput = document.querySelectorAll('input[id^="nome-"]');
            const nomiDaSalvare = {};

            tuttiGliInput.forEach(input => {
                const markerId = input.id.split('-')[1];
                nomiDaSalvare[markerId] = input.value;
            });

            fetch('/salva_tutti_nomi', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nomiDaSalvare)
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Tutti i nomi sono stati salvati in un colpo solo!");
                } else {
                    alert("errore del server.");
                }
            })
            .catch(error => {
                alert("errore di connessione.");
                console.error(error);
            });
            salvaIntervallo();
        }
        function salvaIP() {
            const nuovoIP = document.getElementById('ip-esp32').value;
        
            fetch('/salva_ip', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ip: nuovoIP })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Indirizzo IP dell'ESP32 salvato con successo!");
                } else {
                    alert("errore durante il salvataggio.");
                }
            })
            .catch(error => {
                alert("⚠rrore di rete.");
                console.error(error);
            });
        }
        function salvaIntervallo() {
            const nuovoIntervallo = document.getElementById('intervallo-scansione').value;

            fetch('/salva_intervallo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ intervallo: nuovoIntervallo })
            })
            .then(r => r.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Intervallo di scansione aggiornato!");
                } else {
                    alert("errore: inserisci un valore (in minuti) valido");
                }
            });
        }
    </script>
</body>
</html>
